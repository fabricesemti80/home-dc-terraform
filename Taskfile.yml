version: '3'

tasks:
  default:
    cmds: [task --list]
    silent: true

  init:
    desc: Initialize Proxmox Terraform
    cmds:
      - scripts/tofu.sh -chdir=infra/terraform_proxmox init

  plan:
    desc: Create a full Proxmox plan
    deps: [init]
    cmds:
      - scripts/tofu.sh -chdir=infra/terraform_proxmox plan -out=tfplan

  apply:
    desc: Plan and apply the full Proxmox stack after confirmation
    deps: [init]
    cmds:
      - scripts/tofu.sh -chdir=infra/terraform_proxmox apply
      - task: ensure-lxc-nesting
        vars:
          VMID: "4019"
      - task: ensure-lxc-nesting
        vars:
          VMID: "4020"
      - task: access-all


  plan-preview:
    desc: Create a non-applying full-stack plan for review
    deps: [init]
    cmds:
      - scripts/tofu.sh -chdir=infra/terraform_proxmox plan -out=tfplan-preview

  apply-existing-plan:
    desc: Apply only the explicitly reviewed local tfplan file
    cmds:
      - test -f infra/terraform_proxmox/tfplan
      - scripts/tofu.sh -chdir=infra/terraform_proxmox apply tfplan
      - task: ensure-lxc-nesting
        vars:
          VMID: "4019"
      - task: ensure-lxc-nesting
        vars:
          VMID: "4020"
      - task: access-all

  smoke:
    desc: Plan and apply only the small Terraform test container
    deps: [init]
    cmds:
      - scripts/tofu.sh -chdir=infra/terraform_proxmox plan -target=proxmox_virtual_environment_container.smoke -out=tfplan-smoke
      - scripts/tofu.sh -chdir=infra/terraform_proxmox apply -auto-approve tfplan-smoke
      - task: ensure-lxc-nesting
        vars:
          VMID: "4019"
      - task: access-smoke

  pbs-plan:
    desc: Create a review plan for the PBS LXC only
    deps: [init]
    cmds:
      - scripts/tofu.sh -chdir=infra/terraform_proxmox plan -target=proxmox_virtual_environment_container.pbs -out=tfplan-pbs

  pbs-apply:
    desc: Apply only the PBS LXC
    deps: [init]
    cmds:
      - scripts/tofu.sh -chdir=infra/terraform_proxmox apply -target=proxmox_virtual_environment_container.pbs
      - task: ensure-lxc-nesting
        vars:
          VMID: "4020"
      - task: access-pbs

  ensure-lxc-nesting:
    desc: Enable nesting on an LXC using root access to pve-00
    internal: true
    silent: true
    cmds:
      - bash scripts/ensure-lxc-nesting.sh {{.VMID}}

  nodes-plan:
    desc: Create a review plan for the Talos VM deployment
    deps: [init]
    cmds:
      - scripts/tofu.sh -chdir=infra/terraform_proxmox plan -target=module.talos -out=tfplan-nodes

  nodes-apply:
    desc: Apply Talos VMs from this independent Proxmox root
    deps: [init]
    cmds:
      - scripts/tofu.sh -chdir=infra/terraform_proxmox apply -target=module.talos
      - task: access-nodes

  access-all:
    desc: Print access guidance for all configured guests
    silent: true
    cmds:
      - task: access-smoke
      - task: access-pbs
      - task: access-nodes

  access-smoke:
    desc: Print smoke LXC access guidance
    silent: true
    cmds:
      - |
        printf '%s\n' \
          'SMOKE LXC — VMID 4019' \
          'Address: 10.0.40.19/24 on VLAN 40; reachable from VLAN 40 or routed clients.' \
          'SSH: ssh -i ~/.ssh/id_proxmox root@10.0.40.19' \
          'The matching public key is authorized; password login is not configured.' \
          'If SSH reports a key mismatch, verify the fingerprint below, then run ssh-keygen -R 10.0.40.19.' \
          'PVE console: ssh pve-00, then pct enter 4019 as root.' \
          ''
      - ssh pve-00 'pct exec 4019 -- ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub'

  access-pbs:
    desc: Print PBS LXC access guidance
    silent: true
    cmds:
      - |
        printf '%s\n' \
          'PBS LXC — VMID 4020' \
          'Address: 10.0.40.20/24 on VLAN 40; reachable from VLAN 40 or routed clients.' \
          'SSH: ssh -i ~/.ssh/id_proxmox root@10.0.40.20' \
          'The matching public key is authorized; password login is not configured.' \
          'If SSH reports a key mismatch, verify the fingerprint below, then run ssh-keygen -R 10.0.40.20.' \
          'PBS web UI: https://10.0.40.20:8007 (available after PBS is installed).' \
          'PVE console: ssh pve-00, then pct enter 4020 as root.' \
          ''
      - ssh pve-00 'pct exec 4020 -- ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub'

  access-nodes:
    desc: Print Talos VM access guidance
    silent: true
    cmds:
      - |
        printf '%s\n' \
          'TALOS VMs — planned addresses' \
          'Controller (started): 4090=10.0.40.90' \
          'Workers (started): 4095=10.0.40.95 (k8s-wrkr-01-gpu), 4096=10.0.40.96, 4097=10.0.40.97' \
          'Use the Proxmox web console by VMID. These are planned IPs; reachability depends on guest boot/networking.' \
          '' \
          'Before machine config (maintenance mode):' \
          'talosctl version --insecure --nodes 10.0.40.90' \
          'Only one controller is configured; use 10.0.40.90.' \
          '' \
          'After config/bootstrap (authenticated):' \
          'talosctl --talosconfig <path> --endpoints 10.0.40.90 --nodes <node-IP> version' \
          'This root creates no talosconfig and configures no VIP (including 10.0.40.101).' \
          ''
